name: test

on:
  push:
  pull_request:

jobs:
  boot-wrapper-preflight:
    uses: ./.github/workflows/boot-wrapper-preflight.yml
    with:
      workflow_file: .github/workflows/test.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run test wrapper
        run: sh scripts/test.sh
